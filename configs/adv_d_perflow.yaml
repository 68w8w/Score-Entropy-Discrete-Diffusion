# Adversarial D-PeRFlow Configuration
# Extends D-PeRFlow config with adversarial distillation settings

defaults:
  - _self_
  - model: small
  - override hydra/launcher: submitit_slurm

ngpus: 8
tokens: 50257

# D-PeRFlow specific settings (inherited from d_perflow)
d_perflow:
  teacher_checkpoint: null
  init_from_teacher: True
  num_time_windows: 4
  delta_t: 1e-4
  sampling_eps: 1e-3
  euler_steps: 1
  train_temperature: 1.0

# Adversarial distillation settings
# Loss: L = L_fwd_KL + lambda_rev_kl * L_rev_KL + lambda_adv * L_proj_adv + lambda_gpt2_adv * L_gpt2_adv
adversarial:
  # --- Direction 2: Reverse KL (mode-seeking signal) ---
  # Reverse KL penalizes student for being too smooth/flat.
  # Forward KL (mode-covering) makes student spread mass everywhere;
  # Reverse KL (mode-seeking) forces student to be sharp where teacher is sharp.
  lambda_rev_kl: 0.5       # Weight for reverse KL. 0=disabled. Try 0.3, 0.5, 0.7

  # --- Projected discriminator (teacher-embedding based) ---
  disc_hidden_size: 256    # Hidden dimension
  disc_n_heads: 4          # Number of attention heads
  disc_n_blocks: 4         # Number of transformer blocks
  disc_dropout: 0.1        # Dropout rate
  lambda_adv: 0.1          # Weight for projected adversarial loss

  # --- Direction 1: GPT-2 feature-space adversarial ---
  # Discriminates on Gumbel-Softmax sampled token sequences in GPT-2 feature space.
  # Mirrors image ADD's use of DINO features for projected discrimination.
  enable_gpt2_disc: True   # Set True to enable GPT-2 discriminator
  gpt2_model_name: gpt2    # HuggingFace model name (gpt2, gpt2-medium, etc.)
  gpt2_disc_hidden_size: 256
  gpt2_disc_n_heads: 4
  gpt2_disc_n_blocks: 2    # Fewer blocks (GPT-2 does the heavy lifting)
  gumbel_tau: 0.5          # Gumbel-Softmax temperature (lower=sharper)
  gpt2_feature_layers:     # Which GPT-2 layers to extract features from
    - -1                   # Last layer (high-level semantics)
    - -3                   # Third from last (mid-level features)
  lambda_gpt2_adv: 0.1     # Weight for GPT-2 adversarial loss

  # --- R1 gradient penalty ---
  r1_gamma: 10.0
  r1_interval: 16          # Lazy R1 (StyleGAN2): compute every N disc steps

  # --- Discriminator training ---
  disc_steps_per_gen: 1    # Discriminator updates per generator update

  # --- Discriminator optimizer ---
  disc_lr: 2e-4
  disc_beta1: 0.0          # Low beta1 is standard for GAN discriminators
  disc_beta2: 0.99
  disc_weight_decay: 0.01

training:
  batch_size: 256
  accum: 1
  n_iters: 100001
  snapshot_freq: 10000
  log_freq: 50
  eval_freq: 100
  snapshot_freq_for_preemption: 5000
  weight: standard
  snapshot_sampling: True
  ema: 0.9999

data:
  train: openwebtext
  valid: wikitext103
  cache_dir: data

graph:
  type: absorb
  file: data
  report_all: False

noise:
  type: loglinear
  sigma_min: 1e-4
  sigma_max: 20

sampling:
  predictor: euler
  steps: 4
  noise_removal: True

eval:
  batch_size: 512
  perplexity: True
  perplexity_batch_size: 32

optim:
  weight_decay: 0
  optimizer: AdamW
  lr: 1e-4
  beta1: 0.9
  beta2: 0.999
  eps: 1e-8
  warmup: 1000
  grad_clip: 1.

hydra:
  run:
    dir: exp_local/adv_d_perflow/${data.train}/${now:%Y.%m.%d}/${now:%H%M%S}
  sweep:
    dir: exp/adv_d_perflow/${data.train}/${now:%Y.%m.%d}/${now:%H%M%S}
    subdir: ${hydra.job.num}
  launcher:
    max_num_timeout: 100000
    partition: g40x
    account: stanford
    mem_gb: 96
    cpus_per_task: 40
    gpus_per_node: ${ngpus}
    constraint: null
