# Adversarial D-PeRFlow Configuration
# Extends D-PeRFlow config with adversarial distillation settings

defaults:
  - _self_
  - model: small
  - override hydra/launcher: submitit_slurm

ngpus: 8
tokens: 50257

# D-PeRFlow specific settings (inherited from d_perflow)
d_perflow:
  teacher_checkpoint: null
  init_from_teacher: True
  num_time_windows: 4
  delta_t: 1e-4
  sampling_eps: 1e-3
  euler_steps: 1
  train_temperature: 1.0

# Adversarial distillation settings
# Uses projected discriminator (Projected GAN / ADD approach):
# - Teacher embedding as frozen V->D_model projection
# - Conditional on noisy input x_t for contextual discrimination
# - Per-token + sequence-level dual heads for dense training signal
adversarial:
  # Discriminator architecture (lightweight transformer on projected features)
  disc_hidden_size: 256    # Hidden dimension
  disc_n_heads: 4          # Number of attention heads
  disc_n_blocks: 4         # Number of transformer blocks
  disc_dropout: 0.1        # Dropout rate

  # Adversarial loss weight: L_total = L_KL + lambda_adv * L_adv
  lambda_adv: 0.1

  # R1 gradient penalty for discriminator regularization
  r1_gamma: 10.0

  # Number of discriminator updates per generator update
  disc_steps_per_gen: 1

  # Discriminator optimizer settings
  disc_lr: 2e-4            # Standard lr (projected features make learning easier)
  disc_beta1: 0.0          # Low beta1 is standard for GAN discriminators
  disc_beta2: 0.99
  disc_weight_decay: 0.01

training:
  batch_size: 256
  accum: 1
  n_iters: 100001
  snapshot_freq: 10000
  log_freq: 50
  eval_freq: 100
  snapshot_freq_for_preemption: 5000
  weight: standard
  snapshot_sampling: True
  ema: 0.9999

data:
  train: openwebtext
  valid: wikitext103
  cache_dir: data

graph:
  type: absorb
  file: data
  report_all: False

noise:
  type: loglinear
  sigma_min: 1e-4
  sigma_max: 20

sampling:
  predictor: euler
  steps: 4
  noise_removal: True

eval:
  batch_size: 512
  perplexity: True
  perplexity_batch_size: 32

optim:
  weight_decay: 0
  optimizer: AdamW
  lr: 1e-4
  beta1: 0.9
  beta2: 0.999
  eps: 1e-8
  warmup: 1000
  grad_clip: 1.

hydra:
  run:
    dir: exp_local/adv_d_perflow/${data.train}/${now:%Y.%m.%d}/${now:%H%M%S}
  sweep:
    dir: exp/adv_d_perflow/${data.train}/${now:%Y.%m.%d}/${now:%H%M%S}
    subdir: ${hydra.job.num}
  launcher:
    max_num_timeout: 100000
    partition: g40x
    account: stanford
    mem_gb: 96
    cpus_per_task: 40
    gpus_per_node: ${ngpus}
    constraint: null
