# Adversarial D-PeRFlow Configuration — v3 (Balanced)
#
# SOTA stabilization techniques:
# - Spectral normalization on all discriminator layers (SNGAN)
# - Hinge loss instead of BCE (BigGAN/SAGAN)
# - Adaptive lambda for gradient balancing (VQGAN)
# - LeCam regularization instead of R1 (Tseng et al. 2022)
# - Feature matching auxiliary loss (Salimans et al. 2016)
#
# Loss: L = L_fwd_KL + lambda_rev_kl * L_rev_KL
#        + adaptive_lambda(lambda_adv) * L_proj_adv
#        + adaptive_lambda(lambda_gpt2_adv) * L_gpt2_adv
#        + feature_matching_weight * L_fm

defaults:
  - _self_
  - model: small
  - override hydra/launcher: submitit_slurm

ngpus: 8
tokens: 50257

# D-PeRFlow specific settings (inherited from d_perflow)
d_perflow:
  teacher_checkpoint: null
  init_from_teacher: True
  num_time_windows: 4
  delta_t: 1e-4
  sampling_eps: 1e-3
  euler_steps: 1
  train_temperature: 1.0

# Adversarial distillation settings (v3)
adversarial:
  # --- Reverse KL (mode-seeking signal) ---
  lambda_rev_kl: 0.5

  # --- Projected discriminator (teacher-embedding + spectral norm) ---
  disc_hidden_size: 256
  disc_n_heads: 4
  disc_n_blocks: 4
  disc_dropout: 0.1
  lambda_adv: 0.1          # Base weight for projected adversarial loss

  # --- GPT-2 feature-space adversarial ---
  enable_gpt2_disc: True
  gpt2_model_name: gpt2
  gpt2_disc_hidden_size: 256
  gpt2_disc_n_heads: 4
  gpt2_disc_n_blocks: 2
  gumbel_tau: 0.5
  gpt2_feature_layers:
    - -1
    - -3
  lambda_gpt2_adv: 0.1     # Base weight for GPT-2 adversarial loss

  # --- LeCam regularization (replaces R1) ---
  # Prevents discriminator from becoming overconfident (Tseng et al. 2022)
  lecam_weight: 0.001       # LeCam penalty weight. Try 0.001-0.01
  # R1 kept at 0 (disabled) since LeCam replaces it
  r1_gamma: 0.0
  r1_interval: 16

  # --- Feature matching auxiliary loss ---
  # ||E[f_D(real)] - E[f_D(fake)]||^2 provides smooth gradient signal
  feature_matching_weight: 1.0  # Try 0.5-2.0. 0=disabled.

  # --- Adaptive lambda (VQGAN-style) ---
  # Dynamically balances distillation vs adversarial gradient magnitudes
  adaptive_lambda: True     # Enable/disable adaptive lambda
  max_lambda: 10.0          # Maximum allowed adaptive lambda

  # --- Discriminator training ---
  disc_steps_per_gen: 1

  # --- Discriminator optimizer ---
  disc_lr: 2e-4
  disc_beta1: 0.0
  disc_beta2: 0.99
  disc_weight_decay: 0.01

training:
  batch_size: 256
  accum: 1
  n_iters: 100001
  snapshot_freq: 10000
  log_freq: 50
  eval_freq: 100
  snapshot_freq_for_preemption: 5000
  weight: standard
  snapshot_sampling: True
  ema: 0.9999

data:
  train: openwebtext
  valid: wikitext103
  cache_dir: data

graph:
  type: absorb
  file: data
  report_all: False

noise:
  type: loglinear
  sigma_min: 1e-4
  sigma_max: 20

sampling:
  predictor: euler
  steps: 4
  noise_removal: True

eval:
  batch_size: 512
  perplexity: True
  perplexity_batch_size: 32

optim:
  weight_decay: 0
  optimizer: AdamW
  lr: 1e-4
  beta1: 0.9
  beta2: 0.999
  eps: 1e-8
  warmup: 1000
  grad_clip: 1.

hydra:
  run:
    dir: exp_local/adv_d_perflow/${data.train}/${now:%Y.%m.%d}/${now:%H%M%S}
  sweep:
    dir: exp/adv_d_perflow/${data.train}/${now:%Y.%m.%d}/${now:%H%M%S}
    subdir: ${hydra.job.num}
  launcher:
    max_num_timeout: 100000
    partition: g40x
    account: stanford
    mem_gb: 96
    cpus_per_task: 40
    gpus_per_node: ${ngpus}
    constraint: null
