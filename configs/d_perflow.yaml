# D-PeRFlow Configuration (Pure KL Baseline)
# Loss: fwd_KL + lambda_rev_kl * rev_KL
# No adversarial training, no discriminator, no feature matching

defaults:
  - _self_
  - model: small
  - override hydra/launcher: submitit_slurm

ngpus: 8
tokens: 50257

# D-PeRFlow specific settings
d_perflow:
  # Path to pre-trained teacher model checkpoint
  teacher_checkpoint: null  # Set this to your teacher checkpoint path

  # Whether to initialize student from teacher weights
  init_from_teacher: True

  # Number of time windows K (controls generation steps)
  # K=4 means 4-step generation, K=8 means 8-step, etc.
  num_time_windows: 4

  # Small epsilon to avoid t=0 numerical issues
  sampling_eps: 1e-3

  # Number of steps per window for ODE solver (used by euler and analytic methods)
  # More steps = more accurate teacher distribution but slower
  euler_steps: 1

  # Teacher method for computing target distribution P_{t_{k-1}}:
  #   "euler"        - Taylor approximation I + dt*Q (original, fast but less accurate)
  #   "analytic"     - Exact exp(ΔσQ) multi-step (1st-order Exponential Integrator)
  #   "exp_midpoint" - 2nd-order Exponential Integrator (2 score evals, best accuracy)
  teacher_method: euler

  # Student method for computing student distribution:
  #   "euler"    - Taylor approximation I + dt*Q (fast)
  #   "analytic" - Exact exp(ΔσQ) (more accurate, recommended)
  student_method: analytic

  # Training temperature for softening distributions (1.0 = no scaling)
  train_temperature: 1.0

  # Reverse KL weight: KL(P_student || P_teacher) for mode-seeking behavior
  # 0.0 = pure forward KL only (mode-covering)
  # 0.5 = balanced fwd_KL + rev_KL (recommended for distillation)
  lambda_rev_kl: 0.5

  # Perceptual loss: frozen GPT-2 feature distance
  # 0.0 = disabled (pure KL only)
  # 0.1 = recommended weight for perceptual loss
  lambda_perceptual: 0.0
  perceptual_layers: [2, 5, 8, 11]  # GPT-2 layers to extract features from
  perceptual_loss_type: l2  # l2, cosine, or l1

training:
  batch_size: 256  # Smaller batch for distillation
  accum: 1
  n_iters: 100001  # Fewer iterations for distillation
  snapshot_freq: 10000
  log_freq: 50
  eval_freq: 100
  snapshot_freq_for_preemption: 5000
  weight: standard
  snapshot_sampling: True
  ema: 0.9999

data:
  train: openwebtext
  valid: wikitext103
  cache_dir: data

graph:
  type: absorb
  file: data
  report_all: False

noise:
  type: loglinear
  sigma_min: 1e-4
  sigma_max: 20

sampling:
  predictor: euler
  steps: 4  # Match num_time_windows for evaluation
  noise_removal: True

eval:
  batch_size: 512
  perplexity: True
  perplexity_batch_size: 32

optim:
  weight_decay: 0
  optimizer: AdamW
  lr: 1e-4  # Lower learning rate for distillation
  beta1: 0.9
  beta2: 0.999
  eps: 1e-8
  warmup: 1000
  grad_clip: 1.

hydra:
  run:
    dir: exp_local/d_perflow/${data.train}/${now:%Y.%m.%d}/${now:%H%M%S}
  sweep:
    dir: exp/d_perflow/${data.train}/${now:%Y.%m.%d}/${now:%H%M%S}
    subdir: ${hydra.job.num}
  launcher:
    max_num_timeout: 100000
    partition: g40x
    account: stanford
    mem_gb: 96
    cpus_per_task: 40
    gpus_per_node: ${ngpus}
    constraint: null
